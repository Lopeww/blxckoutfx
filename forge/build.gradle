    // modRuntimeOnly "me.desht.pneumaticcraft:pneumaticcraft-repressurized:6.0.22+mc1.20.1"
    // modRuntimeOnly "appeng:appliedenergistics2-forge:15.4.10"
    // modRuntimeOnly "curse.maven:guideme-1173950:8204776"
    modRuntimeOnly "curse.maven:journeymap-32274:5789363"
    modRuntimeOnly "curse.maven:ftb-quests-forge-289412:8078538"
    modRuntimeOnly "curse.maven:architectury-api-419699:5137938"
    modRuntimeOnly "curse.maven:ftb-library-forge-404465:8226927"
    modRuntimeOnly "curse.maven:ftb-teams-forge-404468:7499810"
