import groovy.json.JsonSlurper
import java.util.jar.JarFile
import org.objectweb.asm.AnnotationVisitor
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.FieldVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

def clientDevGameDir = file('build/dev-client-run')
def clientHotSwapGameDir = file('runs/client-hotswap')

repositories {
    mavenCentral()
    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
            gameDirectory = clientDevGameDir
            programArguments.addAll '--mixin', "${mod_id}.mixins.json"
            programArguments.addAll '--mixin', "${mod_id}.forge.mixins.json"
        }
        clientHotSwap {
            client()
            ideName = 'Forge Client HotSwap'
            // Keep HotSwap state outside build/ so clean cannot remove its working directory.
            gameDirectory = clientHotSwapGameDir
            programArguments.addAll '--mixin', "${mod_id}.mixins.json"
            programArguments.addAll '--mixin', "${mod_id}.forge.mixins.json"
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    modImplementation "curse.maven:terrafirmacraft-302973:8242625"
    modImplementation "curse.maven:firmalife-453394:8360236"
    modImplementation "curse.maven:sacks-n-such-695822:8125848"
    modImplementation "curse.maven:firmaciv-714158:5737719"
    modImplementation "curse.maven:alekiships-1068445:5963449"
    modImplementation "curse.maven:alekis-ridiculously-simple-roofs-1010046:5869457"
    compileOnly project(":common")
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:15.20.0.132"
    modRuntimeOnly "io.github.llamalad7:mixinextras-forge:0.3.5"

    modRuntimeOnly "vazkii.patchouli:Patchouli:1.20.1-85-FORGE"
