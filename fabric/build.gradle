plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

repositories {
    maven {
        name = "Terraformers"
        url = uri("https://maven.terraformersmc.com/releases/")
    }
}

sourceSets.main.java.exclude 'com/lopew/blxckoutfx/mixin/tfc/**'

tasks.named('compileJava', JavaCompile) {
    exclude 'com/lopew/blxckoutfx/mixin/tfc/**'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        clientHotSwap {
            client()
            setConfigName('Fabric Client HotSwap')
            ideConfigGenerated(true)
            runDir('runs/client-hotswap')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Loom preserves an existing generated IDEA run config, including obsolete runDir values.
tasks.named('ideaSyncTask') {
    doFirst {
        delete rootProject.file('.idea/runConfigurations/Fabric_Client_HotSwap___fabric__fabric.xml')
    }
}
