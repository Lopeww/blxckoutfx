tasks.register('verifyJourneyMapCompatibility') {
    inputs.files(configurations.journeyMapLegacyVerification, configurations.journeyMapCurrentVerification)

    doLast {
        def inspectClass = { File archive, String entryName ->
            JarFile jarFile = new JarFile(archive)
            try {
                def entry = jarFile.getJarEntry(entryName)
                if (entry == null) {
                    return null
                }

                def details = [methods: [:], fields: [:]]
                def classBytes = jarFile.getInputStream(entry).bytes
                new ClassReader(classBytes).accept(new ClassVisitor(Opcodes.ASM9) {
                    @Override
                    FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
                        details.fields[name] = descriptor
                        return null
                    }

                    @Override
                    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                        def method = [access: access, calls: [], fieldInstructions: [], typeInstructions: [], stringConstants: [] as Set]
                        details.methods[name + descriptor] = method
                        return new MethodVisitor(Opcodes.ASM9) {
                            @Override
                            void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
                                method.fieldInstructions.add([opcode: opcode, owner: owner, name: fieldName, descriptor: fieldDescriptor])
                            }

                            @Override
                            void visitTypeInsn(int opcode, String type) {
                                method.typeInstructions.add([opcode: opcode, type: type])
                            }

                            @Override
                            void visitLdcInsn(Object value) {
                                if (value instanceof String) {
                                    method.stringConstants.add(value)
                                }
                            }

                            @Override
                            void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                                method.calls.add([opcode: opcode, owner: owner, name: methodName, descriptor: methodDescriptor])
                            }
                        }
                    }
                }, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                return details
            } finally {
                jarFile.close()
            }
        }

        def requireMethod = { Map methods, String owner, String name, String descriptor ->
            if (methods == null || !methods.methods.containsKey(name + descriptor)) {
                throw new GradleException("JourneyMap compatibility target is missing: ${owner}.${name}${descriptor}")
            }
            return methods.methods[name + descriptor]
        }

        def legacyJar = configurations.journeyMapLegacyVerification.singleFile
        def currentJar = configurations.journeyMapCurrentVerification.singleFile
        def themeOwner = 'journeymap/client/ui/theme/ThemeButton'
        def legacyButtonOwner = 'journeymap/client/ui/component/Button'
        def currentButtonOwner = 'journeymap/client/ui/component/buttons/Button'
        def currentBasicImageButtonOwner = 'journeymap/client/ui/component/buttons/BasicImageButton'
        def currentImagePopupButtonOwner = 'journeymap/client/ui/component/popupscreenbutton/ImagePopupButton'
        def currentPopupButtonOwner = 'journeymap/client/ui/component/popupscreenbutton/PopupButton'
        def currentWaypointManagerOwner = 'journeymap/client/ui/waypointmanager/WaypointManager'
        def currentGroupSlotOwner = 'journeymap/client/ui/waypointmanager/group/GroupSlot'
        def currentFullscreenOwner = 'journeymap/client/ui/fullscreen/Fullscreen'
        def currentThemeButtonOwner = 'journeymap/client/ui/theme/ThemeButton'
        def currentThemeToolbarOwner = 'journeymap/client/ui/theme/ThemeToolbar'
        def legacyThemeDescriptor = '(Lcom/mojang/blaze3d/vertex/PoseStack;II)V'
        def currentThemeDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;II)V'
        def legacyButtonDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;IIF)V'
        def currentButtonDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;IIF)V'
        def drawUtilOwner = 'journeymap/client/render/draw/DrawUtil'
        def guiUtilsOwner = 'journeymap/client/ui/GuiUtils'
        def legacyRectangleDescriptor = '(Lcom/mojang/blaze3d/vertex/PoseStack;DDDDIF)V'
        def currentRectangleDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;DDDDIF)V'
        def imageButtonBackgroundDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/resources/ResourceLocation;IIIIIIIIIIIIF)V'
        def imageButtonIconDescriptor = '(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/client/renderer/texture/DynamicTexture;IFDDDDZD)V'

        def legacyTheme = inspectClass(legacyJar, themeOwner + '.class')
        def currentTheme = inspectClass(currentJar, themeOwner + '.class')
        requireMethod(legacyTheme, themeOwner, 'drawNativeButton', legacyThemeDescriptor)
        requireMethod(currentTheme, themeOwner, 'drawNativeButton', currentThemeDescriptor)

        def legacyButton = inspectClass(legacyJar, legacyButtonOwner + '.class')
        def currentButton = inspectClass(currentJar, currentButtonOwner + '.class')
        def legacyRender = requireMethod(legacyButton, legacyButtonOwner, 'm_88315_', legacyButtonDescriptor)
        def currentRender = requireMethod(currentButton, currentButtonOwner, 'm_87963_', currentButtonDescriptor)
        def legacyRectangleCalls = legacyRender.calls.count { call ->
            call.opcode == Opcodes.INVOKESTATIC
                    && call.owner == drawUtilOwner
                    && call.name == 'drawRectangle'
                    && call.descriptor == legacyRectangleDescriptor
        }
        def currentRectangleCalls = currentRender.calls.count { call ->
            call.opcode == Opcodes.INVOKESTATIC
                    && call.owner == drawUtilOwner
                    && call.name == 'drawRectangle'
                    && call.descriptor == currentRectangleDescriptor
        }

        if (legacyRectangleCalls != 7) {
            throw new GradleException("JourneyMap 5.10.3 Button expected 7 legacy drawRectangle calls, found ${legacyRectangleCalls}")
        }
        if (currentRectangleCalls != 7) {
            throw new GradleException("JourneyMap 6.0.4 Button expected 7 GuiGraphics drawRectangle calls, found ${currentRectangleCalls}")
        }
        if (inspectClass(legacyJar, currentButtonOwner + '.class') != null
                || inspectClass(currentJar, legacyButtonOwner + '.class') != null) {
            throw new GradleException('JourneyMap Button owners are not isolated between the legacy and current verification artifacts')
        }

        def basicImageButton = inspectClass(currentJar, currentBasicImageButtonOwner + '.class')
        def basicImageRender = requireMethod(basicImageButton, currentBasicImageButtonOwner, 'm_87963_', currentButtonDescriptor)
        def basicImageBackgroundCalls = basicImageRender.calls.findAll { call ->
            call.opcode == Opcodes.INVOKESTATIC
                    && call.owner == guiUtilsOwner
                    && call.name == 'drawContinuousTexturedBox'
                    && call.descriptor == imageButtonBackgroundDescriptor
        }
        def basicImageIconCalls = basicImageRender.calls.findAll { call ->
            call.opcode == Opcodes.INVOKESTATIC
                    && call.owner == drawUtilOwner
                    && call.name == 'drawQuad'
                    && call.descriptor == imageButtonIconDescriptor
        }
        if (basicImageBackgroundCalls.size() != 1 || basicImageIconCalls.size() != 1) {
            throw new GradleException("JourneyMap 6.0.4 BasicImageButton expected one background and one icon draw, found background=${basicImageBackgroundCalls.size()}, icon=${basicImageIconCalls.size()}")
        }
        if (basicImageRender.calls.indexOf(basicImageBackgroundCalls[0]) >= basicImageRender.calls.indexOf(basicImageIconCalls[0])) {
            throw new GradleException('JourneyMap 6.0.4 BasicImageButton icon draw must remain structurally separate after its background draw')
        }
        if (inspectClass(legacyJar, currentBasicImageButtonOwner + '.class') != null) {
            throw new GradleException('JourneyMap 6 BasicImageButton owner unexpectedly exists in the JourneyMap 5.10.3 verification artifact')
        }

        def waypointManager = inspectClass(currentJar, currentWaypointManagerOwner + '.class')
        def waypointHeader = requireMethod(waypointManager, currentWaypointManagerOwner, 'buildWaypointHeader', '(Lnet/minecraft/client/gui/Font;)V')
        def openOptionsConstructorCalls = waypointHeader.calls.count { call ->
            call.opcode == Opcodes.INVOKESPECIAL
                    && call.owner == currentBasicImageButtonOwner
                    && call.name == '<init>'
                    && call.descriptor == '(IILnet/minecraft/resources/ResourceLocation;Lnet/minecraft/client/gui/components/Button$OnPress;Lnet/minecraft/network/chat/Component;)V'
        }
        if (openOptionsConstructorCalls != 1 || !waypointHeader.stringConstants.contains('jm.waypoint.options.tooltip')) {
            throw new GradleException('JourneyMap 6.0.4 Open Waypoint Options must use exactly one BasicImageButton with its expected tooltip key')
        }

        def groupSlot = inspectClass(currentJar, currentGroupSlotOwner + '.class')
        def groupSlotInit = requireMethod(groupSlot, currentGroupSlotOwner, 'init', '()V')
        def editGroupConstructorCalls = groupSlotInit.calls.count { call ->
            call.opcode == Opcodes.INVOKESPECIAL
                    && call.owner == currentImagePopupButtonOwner
                    && call.name == '<init>'
                    && call.descriptor == '(IILjourneymap/client/texture/WidgetSprites;Lnet/minecraft/network/chat/Component;Ljava/util/function/Supplier;Ljourneymap/client/ui/component/popupscreenbutton/PopupButtonScreen$OnClose;)V'
        }
        def groupPowerConstructorCalls = groupSlotInit.calls.count { call ->
            call.opcode == Opcodes.INVOKESPECIAL
                    && call.owner == currentBasicImageButtonOwner
                    && call.name == '<init>'
                    && call.descriptor == '(IILnet/minecraft/resources/ResourceLocation;Ljava/lang/Integer;Lnet/minecraft/client/gui/components/Button$OnPress;Lnet/minecraft/network/chat/Component;)V'
        }
        if (editGroupConstructorCalls != 1 || !groupSlotInit.stringConstants.contains('jm.waypoint.group.edit.label')) {
            throw new GradleException('JourneyMap 6.0.4 Edit Group must use exactly one ImagePopupButton with its expected label key')
        }
        if (groupPowerConstructorCalls != 1) {
            throw new GradleException("JourneyMap 6.0.4 group enable/disable control expected one colored BasicImageButton, found ${groupPowerConstructorCalls}")
        }
        def groupEnabledComponent = requireMethod(groupSlot, currentGroupSlotOwner, 'getEnabledComponent', '(Z)Lnet/minecraft/network/chat/Component;')
        if (!groupEnabledComponent.stringConstants.containsAll(['jm.waypoint.disable_group', 'jm.waypoint.enable_group'])) {
            throw new GradleException('JourneyMap 6.0.4 group power control is missing its enable/disable state keys')
        }

        def imagePopupButton = inspectClass(currentJar, currentImagePopupButtonOwner + '.class')
        def imagePopupRender = requireMethod(imagePopupButton, currentImagePopupButtonOwner, 'm_87963_', currentButtonDescriptor)
        def popupBackgroundCall = imagePopupRender.calls.find { call ->
            call.opcode == Opcodes.INVOKESPECIAL
                    && call.owner == currentPopupButtonOwner
                    && call.name == 'm_87963_'
                    && call.descriptor == currentButtonDescriptor
        }
        def popupIconCall = imagePopupRender.calls.find { call ->
            call.opcode == Opcodes.INVOKESTATIC
                    && call.owner == drawUtilOwner
                    && call.name == 'drawQuad'
                    && call.descriptor == imageButtonIconDescriptor
        }
        if (popupBackgroundCall == null || popupIconCall == null
                || imagePopupRender.calls.indexOf(popupBackgroundCall) >= imagePopupRender.calls.indexOf(popupIconCall)) {
            throw new GradleException('JourneyMap 6.0.4 ImagePopupButton must render its inherited Button background before its separate icon draw')
        }

        def fullscreen = inspectClass(currentJar, currentFullscreenOwner + '.class')
        def fullscreenInitButtons = requireMethod(fullscreen, currentFullscreenOwner, 'initButtons', '()V')
        def fullscreenLayoutButtons = requireMethod(fullscreen, currentFullscreenOwner, 'layoutButtons', '(Lnet/minecraft/client/gui/GuiGraphics;)V')
        def fullscreenRender = requireMethod(fullscreen, currentFullscreenOwner, 'm_88315_', currentButtonDescriptor)
        ['buttonZoomIn', 'buttonZoomOut'].each { field ->
            if (fullscreen.fields[field] != "L${currentThemeButtonOwner};") {
                throw new GradleException("JourneyMap 6.0.4 Fullscreen ${field} must remain a ThemeButton, found ${fullscreen.fields[field]}")
            }
            if (!fullscreenInitButtons.fieldInstructions.any { access ->
                access.opcode == Opcodes.PUTFIELD
                        && access.owner == currentFullscreenOwner
                        && access.name == field
                        && access.descriptor == "L${currentThemeButtonOwner};"
            }) {
                throw new GradleException("JourneyMap 6.0.4 Fullscreen initButtons no longer constructs ${field}")
            }
        }
        if (!fullscreenInitButtons.stringConstants.containsAll(['jm.fullscreen.zoom_in', 'jm.fullscreen.zoom_out'])) {
            throw new GradleException('JourneyMap 6.0.4 Fullscreen initButtons is missing the Zoom In/Out controls')
        }
        if (!fullscreenLayoutButtons.calls.any { call ->
            call.owner == currentThemeToolbarOwner && call.name == 'layoutCenteredVertical'
        }) {
            throw new GradleException('JourneyMap 6.0.4 Fullscreen layoutButtons no longer lays out the vertical zoom toolbar')
        }
        if (!fullscreenLayoutButtons.fieldInstructions.any { access ->
            access.owner == currentFullscreenOwner
                    && access.name == 'buttonZoomOut'
                    && access.descriptor == "L${currentThemeButtonOwner};"
        }) {
            throw new GradleException('JourneyMap 6.0.4 Fullscreen layoutButtons no longer references buttonZoomOut')
        }
        def fullscreenLayoutCall = fullscreenRender.calls.findIndexOf { call ->
            call.owner == currentFullscreenOwner
                    && call.name == 'layoutButtons'
                    && call.descriptor == '(Lnet/minecraft/client/gui/GuiGraphics;)V'
        }
        def fullscreenRenderablesCall = fullscreenRender.calls.findIndexOf { call ->
            call.owner == currentFullscreenOwner
                    && call.name == 'getRenderables'
                    && call.descriptor == '()Ljava/util/List;'
        }
        def fullscreenWidgetRenderCall = fullscreenRender.calls.findIndexOf { call ->
            call.owner == 'net/minecraft/client/gui/components/Button'
                    && call.name == 'm_88315_'
                    && call.descriptor == currentButtonDescriptor
        }
        if (fullscreenLayoutCall < 0
                || fullscreenRenderablesCall <= fullscreenLayoutCall
                || fullscreenWidgetRenderCall <= fullscreenRenderablesCall) {
            throw new GradleException('JourneyMap 6.0.4 Fullscreen must lay out controls before rendering its Screen renderables')
        }
    }
}

tasks.register('verifyReleaseArtifact') {
    dependsOn tasks.named('reobfJar')

    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def expectedRefmap = "${mod_id}-${project.name}-${minecraft_version}-refmap.json"
        def journeyMapThemeMixinEntry = 'com/lopew/blxckoutfx/mixin/journeymap/JourneyMapThemeButtonMixin.class'
        def journeyMapLegacyButtonMixinEntry = 'com/lopew/blxckoutfx/mixin/journeymap/JourneyMapButtonBackgroundMixin.class'
        def journeyMap6BasicImageButtonMixinEntry = 'com/lopew/blxckoutfx/mixin/journeymap/JourneyMap6BasicImageButtonBackgroundMixin.class'
        def journeyMap6ButtonMixinEntry = 'com/lopew/blxckoutfx/mixin/journeymap/JourneyMap6ButtonBackgroundMixin.class'
        def journeyMap6FullscreenShortcutMixinEntry = 'com/lopew/blxckoutfx/mixin/journeymap/JourneyMap6FullscreenShortcutMixin.class'
        def journeyMapFullscreenShortcutHelperEntry = 'com/lopew/blxckoutfx/client/integration/journeymap/BlxckoutFXJourneyMapFullscreenShortcut.class'
        def journeyMapButtonPluginEntry = 'com/lopew/blxckoutfx/mixinplugin/JourneyMapButtonMixinPlugin.class'
        def journeyMapButtonPluginClass = 'com.lopew.blxckoutfx.mixinplugin.JourneyMapButtonMixinPlugin'
        def imageButtonMixinEntry = 'com/lopew/blxckoutfx/mixin/core/ImageButtonMixin.class'
        def recipeButtonMixinEntry = 'com/lopew/blxckoutfx/mixin/core/InventoryRecipeBookButtonMixin.class'
        def recipeFilterMixinEntry = 'com/lopew/blxckoutfx/mixin/core/InventoryRecipeBookFilterMixin.class'
        def imageButtonStateEntry = 'com/lopew/blxckoutfx/client/bridge/ImageButtonState.class'
        def legacyImageButtonStateEntry = 'com/lopew/blxckoutfx/mixin/core/ImageButtonState.class'
        def requiredEntries = [
                'META-INF/mods.toml',
                "${mod_id}.mixins.json",
                "${mod_id}.forge.mixins.json",
                expectedRefmap,
                journeyMapThemeMixinEntry,
                journeyMapLegacyButtonMixinEntry,
                journeyMap6BasicImageButtonMixinEntry,
                journeyMap6ButtonMixinEntry,
                journeyMap6FullscreenShortcutMixinEntry,
                journeyMapFullscreenShortcutHelperEntry,
                journeyMapButtonPluginEntry,
                imageButtonMixinEntry,
                recipeButtonMixinEntry,
                recipeFilterMixinEntry,
                imageButtonStateEntry
        ]

        if (!artifact.isFile()) {
            throw new GradleException("Forge release artifact was not created: ${artifact}")
        }

        JarFile jarFile = new JarFile(artifact)
        try {
            def entryCounts = [:].withDefault { 0 }
            def entries = jarFile.entries()
            while (entries.hasMoreElements()) {
                entryCounts[entries.nextElement().name]++
            }
            requiredEntries.each { entry ->
                if (entryCounts[entry] != 1) {
                    throw new GradleException("Forge release artifact must contain exactly one ${entry}, found ${entryCounts[entry]}")
                }
            }
            if (entryCounts.containsKey(legacyImageButtonStateEntry)) {
                throw new GradleException("Forge release artifact contains mixin-package runtime helper ${legacyImageButtonStateEntry}")
            }

            def readEntry = { String name ->
                jarFile.getInputStream(jarFile.getJarEntry(name)).getText('UTF-8')
            }
            def inspectClass = { String entryName ->
                def details = [
                        interfaces  : [] as Set,
                        fields      : [:],
                        shadowFields: [] as Set,
                        methods     : [] as Set,
                        methodDescriptors: [:].withDefault { [] as Set },
                        methodCalls : [],
                        typeInstructions: [] as Set,
                        stringConstants: [] as Set
                ]
                def classBytes = jarFile.getInputStream(jarFile.getJarEntry(entryName)).bytes
                new ClassReader(classBytes).accept(new ClassVisitor(Opcodes.ASM9) {
                    @Override
                    void visit(int version, int access, String name, String signature, String superName, String[] interfaces) {
                        if (interfaces != null) {
                            details.interfaces.addAll(interfaces)
                        }
                    }

                    @Override
                    FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
                        details.fields[name] = descriptor
                        return new FieldVisitor(Opcodes.ASM9) {
                            @Override
                            AnnotationVisitor visitAnnotation(String annotationDescriptor, boolean visible) {
                                if (annotationDescriptor == 'Lorg/spongepowered/asm/mixin/Shadow;') {
                                    details.shadowFields.add(name)
                                }
                                return null
                            }
                        }
                    }

                    @Override
                    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                        details.methods.add(name)
                        details.methodDescriptors[name].add(descriptor)
                        return new MethodVisitor(Opcodes.ASM9) {
                            @Override
                            void visitTypeInsn(int opcode, String type) {
                                details.typeInstructions.add(type)
                            }

                            @Override
                            void visitLdcInsn(Object value) {
                                if (value instanceof String) {
                                    details.stringConstants.add(value)
                                }
                            }

                            @Override
                            void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                                details.methodCalls.add([owner: owner, name: methodName, descriptor: methodDescriptor])
                            }
                        }
                    }
                }, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                return details
            }

            def imageButtonMixin = inspectClass(imageButtonMixinEntry)
            def recipeButtonMixin = inspectClass(recipeButtonMixinEntry)
            def recipeFilterMixin = inspectClass(recipeFilterMixinEntry)
            def journeyMapThemeMixin = inspectClass(journeyMapThemeMixinEntry)
            def journeyMap6BasicImageButtonMixin = inspectClass(journeyMap6BasicImageButtonMixinEntry)
            def journeyMap6FullscreenShortcutMixin = inspectClass(journeyMap6FullscreenShortcutMixinEntry)
            def journeyMapButtonPlugin = inspectClass(journeyMapButtonPluginEntry)
            def callbackDescriptor = '(Lorg/spongepowered/asm/mixin/injection/callback/CallbackInfo;)V'
            def imageButtonStateName = 'com/lopew/blxckoutfx/client/bridge/ImageButtonState'
            def legacyImageButtonFields = ['resourceLocation', 'xTexStart', 'yTexStart', 'yDiffTex', 'textureWidth', 'textureHeight'] as Set
            def legacyFilterFields = ['resourceLocation', 'isStateTriggered', 'xTexStart', 'yTexStart', 'xDiffTex', 'yDiffTex'] as Set

            if (!imageButtonMixin.shadowFields.isEmpty()) {
                throw new GradleException("ImageButtonMixin release bytecode still contains @Shadow fields: ${imageButtonMixin.shadowFields}")
            }
            if (!imageButtonMixin.interfaces.contains(imageButtonStateName)) {
                throw new GradleException('ImageButtonMixin release bytecode does not expose captured state through ImageButtonState')
            }
            ['blxckoutfx$resourceLocation', 'blxckoutfx$xTexStart', 'blxckoutfx$yTexStart', 'blxckoutfx$yDiffTex', 'blxckoutfx$textureWidth', 'blxckoutfx$textureHeight'].each { field ->
                if (!imageButtonMixin.fields.containsKey(field)) {
                    throw new GradleException("ImageButtonMixin release bytecode is missing captured field ${field}")
                }
            }
            ['blxckoutfx$captureStateShort', 'blxckoutfx$captureStateDefaultTexture', 'blxckoutfx$captureStateSized', 'blxckoutfx$captureStateSizedWithNarration'].each { method ->
                if (!imageButtonMixin.methods.contains(method)) {
                    throw new GradleException("ImageButtonMixin release bytecode is missing ${method}")
                }
            }

            def recipeButtonLegacyShadows = recipeButtonMixin.shadowFields.intersect(legacyImageButtonFields)
            def recipeButtonLegacyFields = recipeButtonMixin.fields.keySet().intersect(legacyImageButtonFields)
            if (!recipeButtonLegacyShadows.isEmpty() || !recipeButtonLegacyFields.isEmpty()) {
                throw new GradleException("InventoryRecipeBookButtonMixin still depends on ImageButton fields: shadows=${recipeButtonLegacyShadows}, fields=${recipeButtonLegacyFields}")
            }
            ['blxckoutfx$getResourceLocation', 'blxckoutfx$getXTexStart', 'blxckoutfx$getYTexStart', 'blxckoutfx$getYDiffTex', 'blxckoutfx$getTextureWidth', 'blxckoutfx$getTextureHeight'].each { method ->
                if (!recipeButtonMixin.methodCalls.any { call -> call.owner == imageButtonStateName && call.name == method }) {
                    throw new GradleException("InventoryRecipeBookButtonMixin release bytecode does not use ImageButtonState.${method}")
                }
            }
            if (!recipeButtonMixin.typeInstructions.contains(imageButtonStateName)) {
                throw new GradleException('InventoryRecipeBookButtonMixin release bytecode does not cast to external ImageButtonState')
            }

            def recipeFilterLegacyShadows = recipeFilterMixin.shadowFields.intersect(legacyFilterFields)
            def recipeFilterLegacyFields = recipeFilterMixin.fields.keySet().intersect(legacyFilterFields)
            if (!recipeFilterLegacyShadows.isEmpty() || !recipeFilterLegacyFields.isEmpty()) {
                throw new GradleException("InventoryRecipeBookFilterMixin still depends on StateSwitchingButton fields: shadows=${recipeFilterLegacyShadows}, fields=${recipeFilterLegacyFields}")
            }
            if (!recipeFilterMixin.methods.contains('blxckoutfx$captureTextureState')) {
                throw new GradleException('InventoryRecipeBookFilterMixin release bytecode is missing texture state capture')
            }
            ['blxckoutfx$enterPuristBackgroundDarkening', 'blxckoutfx$exitPuristBackgroundDarkening'].each { method ->
                if (journeyMapThemeMixin.methodDescriptors[method] != ([callbackDescriptor] as Set)) {
                    throw new GradleException("JourneyMap ThemeButton handler ${method} must use only CallbackInfo, found ${journeyMapThemeMixin.methodDescriptors[method]}")
                }
            }
            ['blxckoutfx$enterBackgroundDarkening', 'blxckoutfx$exitBackgroundDarkening'].each { method ->
                if (journeyMap6BasicImageButtonMixin.methodDescriptors[method] != ([callbackDescriptor] as Set)) {
                    throw new GradleException("JourneyMap 6 BasicImageButton handler ${method} must use only CallbackInfo, found ${journeyMap6BasicImageButtonMixin.methodDescriptors[method]}")
                }
            }
            if (journeyMap6FullscreenShortcutMixin.methodDescriptors['blxckoutfx$layoutFullscreenShortcut'] != ([callbackDescriptor] as Set)) {
                throw new GradleException("JourneyMap 6 Fullscreen shortcut handler must use only CallbackInfo, found ${journeyMap6FullscreenShortcutMixin.methodDescriptors['blxckoutfx$layoutFullscreenShortcut']}")
            }
            if (!journeyMap6FullscreenShortcutMixin.methodCalls.any { call ->
                call.owner == 'com/lopew/blxckoutfx/client/integration/journeymap/BlxckoutFXJourneyMapFullscreenShortcut'
                        && call.name == 'layoutShortcut'
            }) {
                throw new GradleException('JourneyMap 6 Fullscreen shortcut mixin does not call its compatibility helper')
            }
            if (!journeyMapButtonPlugin.interfaces.contains('org/spongepowered/asm/mixin/extensibility/IMixinConfigPlugin')) {
                throw new GradleException('JourneyMap Button routing plugin does not implement IMixinConfigPlugin')
            }
            [
                    'com.lopew.blxckoutfx.mixin.journeymap.JourneyMapButtonBackgroundMixin',
                    'com.lopew.blxckoutfx.mixin.journeymap.JourneyMap6ButtonBackgroundMixin',
                    'com.lopew.blxckoutfx.mixin.journeymap.JourneyMap6BasicImageButtonBackgroundMixin',
                    'com.lopew.blxckoutfx.mixin.journeymap.JourneyMap6FullscreenShortcutMixin'
            ].each { mixinClass ->
                if (!journeyMapButtonPlugin.stringConstants.contains(mixinClass)) {
                    throw new GradleException("JourneyMap Button routing plugin does not explicitly route ${mixinClass}")
                }
            }

            def mixinConfigs = []
            ["${mod_id}.mixins.json", "${mod_id}.forge.mixins.json"].each { configName ->
                def configText = readEntry(configName)
                if (configText.contains('${')) {
                    throw new GradleException("${configName} contains an unresolved placeholder")
                }
                def config = new JsonSlurper().parseText(configText)
                if (config.refmap != expectedRefmap) {
                    throw new GradleException("${configName} references ${config.refmap}, expected ${expectedRefmap}")
                }
                if (configName == "${mod_id}.mixins.json" && config.plugin != journeyMapButtonPluginClass) {
                    throw new GradleException("${configName} must use ${journeyMapButtonPluginClass} for JourneyMap Button routing")
                }
                mixinConfigs.add(config)
            }

            def configuredMixinClassList = []
            def configuredMixinClasses = [] as Set
            def mixinPackagePrefixes = [] as Set
            mixinConfigs.each { config ->
                def packagePrefix = config.package.replace('.', '/') + '/'
                mixinPackagePrefixes.add(packagePrefix)
                ['mixins', 'client', 'server'].each { section ->
                    (config[section] ?: []).each { mixinName ->
                        def mixinClass = packagePrefix + mixinName.replace('.', '/') + '.class'
                        configuredMixinClassList.add(mixinClass)
                        configuredMixinClasses.add(mixinClass)
                    }
                }
            }
            [journeyMapThemeMixinEntry, journeyMapLegacyButtonMixinEntry, journeyMap6ButtonMixinEntry, journeyMap6BasicImageButtonMixinEntry, journeyMap6FullscreenShortcutMixinEntry].each { entry ->
                def registrations = configuredMixinClassList.count { configured -> configured == entry }
                if (registrations != 1) {
                    throw new GradleException("JourneyMap mixin ${entry} must be registered exactly once, found ${registrations}")
                }
            }
            def duplicateMixins = configuredMixinClassList.countBy { it }.findAll { mixinClass, registrations -> registrations != 1 }
            if (!duplicateMixins.isEmpty()) {
                throw new GradleException("Mixin configs contain duplicate registrations: ${duplicateMixins}")
            }
            def unexpectedMixinPackageClasses = entryCounts.keySet().findAll { entry ->
                entry.endsWith('.class') && mixinPackagePrefixes.any { prefix -> entry.startsWith(prefix) }
            }.findAll { entry ->
                def outerClass = entry.contains('$') ? entry.substring(0, entry.indexOf('$')) + '.class' : entry
                !configuredMixinClasses.contains(outerClass)
            }
            if (!unexpectedMixinPackageClasses.isEmpty()) {
                throw new GradleException("Forge release artifact contains unconfigured classes in a defined mixin package: ${unexpectedMixinPackageClasses}")
            }

            def refmapText = readEntry(expectedRefmap)
            if (refmapText.contains('${')) {
                throw new GradleException("${expectedRefmap} contains an unresolved placeholder")
            }
            def refmap = new JsonSlurper().parseText(refmapText)
            [
                    'com/lopew/blxckoutfx/mixin/core/ImageButtonMixin'              : legacyImageButtonFields,
                    'com/lopew/blxckoutfx/mixin/core/InventoryRecipeBookButtonMixin': legacyImageButtonFields,
                    'com/lopew/blxckoutfx/mixin/core/InventoryRecipeBookFilterMixin': legacyFilterFields
            ].each { mixinName, forbiddenFields ->
                def mappings = refmap.mappings[mixinName]
                if (mappings == null) {
                    throw new GradleException("Forge refmap is missing ${mixinName}")
                }
                def staleFields = mappings.keySet().findAll { key ->
                    forbiddenFields.any { field -> key == field || key.startsWith("${field}:") }
                }
                if (!staleFields.isEmpty()) {
                    throw new GradleException("Forge refmap contains stale field mappings for ${mixinName}: ${staleFields}")
                }
            }
        } finally {
            jarFile.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyJourneyMapCompatibility')
    dependsOn tasks.named('verifyReleaseArtifact')
}

jar {
    finalizedBy('reobfJar')
}
